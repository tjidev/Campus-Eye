 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusEye - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            background-color: aliceblue;
            min-height: 100vh;
            padding: 40px;
            font-family: Arial, sans-serif;
        }
        .header {
            text-align: center;
            padding: 20px;
            margin-bottom: 40px;
        }
        .dashboard {
            width: 900px;
            padding: 40px;
            margin: 20px;
            background-color: whitesmoke;
            border-radius: 10px;
            box-shadow: 0 0 10px lightgray;
        }
        .summary {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .card {
            flex: 1;
            min-width: 150px;
            border: 1px solid black;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px gray;
            background-color: lightblue;
        }
        .card p {
            font-size: 30px;
            font-weight: bold;
            color: blue;
            margin-top: 10px;
        }
        .complaint-card {
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid lightgray;
            border-radius: 10px;
            box-shadow: 0 0 8px lightgray;
            margin-top: 20px;
            background: white;
        }
        select {
            padding: 8px;
            border-radius: 5px;
            margin-top: 10px;
            margin-right: 10px;
        }
        .update-btn {
            padding: 8px 16px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .update-btn:hover { background-color: blue; transform: scale(1.05); }
        .logout {
            background: red;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .logout:hover { background: darkred; }
        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .search input {
            flex: 1;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .search button {
            padding: 8px 16px;
            background: royalblue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .filter-box { margin-bottom: 20px; }
        .no-data {
            text-align: center;
            color: #888;
            padding: 40px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .badge-pending { background: #e74c3c; }
        .badge-progress { background: #3498db; }
        .badge-resolved { background: #2ecc71; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>CampusEye</h1>
            <h3>Welcome Admin</h3>
            <button class="logout" onclick="logout()">Logout</button>
        </div>
        <div class="summary">
            <div class="card">
                <h3>Total</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="card">
                <h3>Pending</h3>
                <p id="pendingCount">0</p>
            </div>
            <div class="card">
                <h3>In Progress</h3>
                <p id="progressCount">0</p>
            </div>
            <div class="card">
                <h3>Resolved</h3>
                <p id="resolvedCount">0</p>
            </div>
        </div>
        <div class="complaints">
            <h2>All Complaints</h2>
            <div class="filter-box">
                <label>Filter by status:</label>
                <select id="filterStatus" onchange="loadComplaints()">
                    <option value="all">All</option>
                    <option value="pending">Pending</option>
                    <option value="in progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                </select>
            </div>
            <div class="search">
                <input type="text" id="searchInput" placeholder="Search by student name or title...">
                <button onclick="loadComplaints()">Search</button>
            </div>
            <div id="complaintsList"></div>
        </div>
    </div>

    <script src="campus-eye-backend/frontend-api.js"></script>
    <script>
        requireAuth();
        requireRole('Admin');

        async function loadStats() {
            const res = await apiCall('/dashboard/admin');
            if (res.success) {
                document.getElementById('totalCount').textContent = res.stats.total;
                document.getElementById('pendingCount').textContent = res.stats.pending;
                document.getElementById('progressCount').textContent = res.stats.inProgress;
                document.getElementById('resolvedCount').textContent = res.stats.resolved;
            }
        }

        async function loadComplaints() {
            const status = document.getElementById('filterStatus').value;
            const search = document.getElementById('searchInput').value;
            let url = '/complaints?status=' + encodeURIComponent(status);
            if (search) url += '&search=' + encodeURIComponent(search);

            const res = await apiCall(url);
            const container = document.getElementById('complaintsList');

            if (!res.success || res.complaints.length === 0) {
                container.innerHTML = '<p class="no-data">No complaints found.</p>';
                return;
            }

            container.innerHTML = res.complaints.map(c => {
                let badgeClass = 'badge-pending';
                if (c.status === 'in progress') badgeClass = 'badge-progress';
                if (c.status === 'resolved') badgeClass = 'badge-resolved';
                return `
                <div class="complaint-card">
                    <h3>${c.title}</h3>
                    <p><strong>Student:</strong> ${c.studentName}</p>
                    <p><strong>Category:</strong> ${c.category}</p>
                    <p><strong>Location:</strong> ${c.location}</p>
                    <p><strong>Priority:</strong> ${c.priority}</p>
                    <p><strong>Date:</strong> ${c.date}</p>
                    <p><strong>Status:</strong> <span class="badge ${badgeClass}">${c.status}</span></p>
                    <label>Update Status:</label>
                    <select id="status-${c.id}">
                        <option value="pending" ${c.status === 'pending' ? 'selected' : ''}>Pending</option>
                        <option value="in progress" ${c.status === 'in progress' ? 'selected' : ''}>In Progress</option>
                        <option value="resolved" ${c.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                    </select>
                    <button class="update-btn" onclick="updateStatus(${c.id})">Update</button>
                </div>`;
            }).join('');
        }

        async function updateStatus(id) {
            const status = document.getElementById('status-' + id).value;
            const res = await apiCall('/complaints/' + id + '/status', 'PUT', { status });
            if (res.success) {
                alert('Status updated!');
                loadStats();
                loadComplaints();
            } else {
                alert(res.message);
            }
        }

        loadStats();
        loadComplaints();
    </script>
</body>
</html>
